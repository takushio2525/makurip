<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Makurip settings harness</title>
<link rel="stylesheet" href="file://@DESIGN@/shared/base.css">
<link rel="stylesheet" href="file://@DESIGN@/shared/panel-b.css">
<style>
  /* 比較用: 背景を単色にして、設定シートだけを出す（Swift 側の flat 描画と同じ条件にする）。
     シートは試作どおり画面（1440×900）の中央・上下 40px の余白（幅 640・高さ 820） */
  body { background: var(--flat) !important; }
  :root { --flat: #dfe6f0; }
  :root[data-theme="dark"] { --flat: #10131c; }
  .desk, .closed-hint, .mk-toast, .mk-proto, .pb, .peek-panel, .mk-pop { display: none !important; }
  .set-win { box-shadow: 0 0 0 .5px rgba(0, 0, 0, .25) !important; }
  .rec-pill { animation: none !important; }
</style>
<script src="file://@DESIGN@/shared/data.js"></script>
<script src="file://@DESIGN@/shared/core.js"></script>
<script src="file://@DESIGN@/shared/panel-b.js"></script>
</head>
<body>
<script>
  // 候補窓と一覧をまとめた統合版（candidate.html と同じ）。設定シートに「動き」の行が出る
  Mk.buildDesktop('b');
  Mk.start(Mk.designs.b.mount(), { integrated: true });
  Mk.sheet.show();
  const key = (code) => Mk.sheet.onKey({
    code, key: code, metaKey: false, ctrlKey: false, altKey: false, shiftKey: false,
    preventDefault() {}, stopPropagation() {},
  });
  // state=keys: 「コピー方法を切り替え」まで下りて Enter（新しいキーを押す…）。試作の settings-keys.png と同じ行
  if (Mk.params.get('state') === 'keys') {
    const index = Mk.sheetRows().findIndex((r) => r.type === 'key' && r.a.id === 'method');
    for (let i = 0; i < index; i++) key('ArrowDown');
    key('Enter');
  }
</script>
</body>
</html>
