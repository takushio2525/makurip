<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- メニューバー用テンプレート画像（黒 + 透明度のみ。色はシステムが付ける）。@2x とベクター用 -->
  <!-- 付箋 3 枚を左上へ 2pt ずつずらして重ねる。奥の 2 枚は 1pt の L 字、手前は塗りで文字行を抜く。 -->
  <!-- 辺はすべて 0.5pt の格子上にあるので @2x でにじまない。16px（@1x）は menubar-16.svg を使う -->
  <!-- 奥の付箋 -->
  <path d="M2.5,10 V3.5 A1,1 0 0 1 3.5,2.5 H10" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- 中ほどの付箋 -->
  <path d="M4.5,12 V5.5 A1,1 0 0 1 5.5,4.5 H12" fill="none" stroke="#000000" stroke-width="1"/>
  <!-- 手前の付箋と、抜いた文字行 -->
  <path d="M7.25,6 H13.75 A1.25,1.25 0 0 1 15,7.25 V13.75 A1.25,1.25 0 0 1 13.75,15 H7.25 A1.25,1.25 0 0 1 6,13.75 V7.25 A1.25,1.25 0 0 1 7.25,6 Z M8.5,9 H12.5 A0.5,0.5 0 0 1 12.5,10 H8.5 A0.5,0.5 0 0 1 8.5,9 Z M8.5,11 H10.5 A0.5,0.5 0 0 1 10.5,12 H8.5 A0.5,0.5 0 0 1 8.5,11 Z" fill="#000000" fill-rule="evenodd"/>
</svg>
